<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <title>Prévisions météo</title>
</head>

<body>

    <input type="text" id="ville" placeholder="Entrez une ville..." />

    <table class="table bg-light">
        <thead class="table-dark">
            <tr>
                <th scope="col">Date et Heure</th>
                <th scope="col">Température</th>
                <th scope="col">Description</th>
                <th scope="col">Temps</th>
            </tr>

        </thead>
        <tbody id="tbody">
        </tbody>

    </table>

    <script src="config.js"></script>
    <script>

        document.getElementById("ville").addEventListener("keypress", function (event) {
            if (event.key === "Enter") {
                event.preventDefault();
                getData();
            }
        });

        async function getData() {

            const ville = document.getElementById("ville").value;

            const url = `https://api.openweathermap.org/data/2.5/forecast?q=${ville}&appid=${API_KEY}&units=metric&lang=fr`;
            try {
                const reponse = await fetch(url);
                if (!reponse.ok) {
                    throw new Error(`Statut de réponse : ${reponse.status}`);
                }

                const resultat = await reponse.json();

                let text = "";

                resultat.list.forEach(prevision);
                function prevision(item, index) {

                    const d = new Date(item.dt * 1000);
                    const date = d.toLocaleString("fr");

                    text += "<tr>";
                    text += "<td>" + date + "</td>";
                    text += "<td>" + item.main.temp + " °C </td>";
                    text += "<td>" + item.weather[0].description + "</td>";
                    text += "<td><img src='https://openweathermap.org/img/wn/" + item.weather[0].icon + ".png'></td>";
                    text += "</tr>";

                }

                document.getElementById("tbody").innerHTML = text;

            } catch (erreur) {
                console.error(erreur.message);
            }
        }

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>

</body>

</html>
